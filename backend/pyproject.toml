[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zreta-device-control"
version = "0.1.0"
description = "Consent-based Android device-management platform (Phase 1 backend)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.17,<5.3",
    "djangorestframework>=3.16.1,<3.17",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "segno>=1.6,<2",
    "PyJWT>=2.9,<3",
    "cryptography>=44,<47",
    "gunicorn>=23,<24",
    "firebase-admin>=6.5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "zreta_control.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --reuse-db"
