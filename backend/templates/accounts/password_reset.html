{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="col-md-5">
  <h1 class="h3 mb-3">Reset password</h1>
  <p>Enter your account email. Local development prints the reset link to the console.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send reset email</button>
  </form>
</div>
{% endblock %}
